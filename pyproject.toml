[project]
name = "mongo-to-parquet"
version = "1.0.0"
description = "Production-ready MongoDB to Parquet exporter for IoT data archival"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.6.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "python-json-logger>=2.0.7",
    "tenacity>=8.2.3",
    "tqdm>=4.66.0",
    "pandas>=2.1.0",
    "typer>=0.12.0",
    "structlog>=24.0.0",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mongomock>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mongodb_to_parquet"]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest-cov>=7.0.0",
]

[project.scripts]
mongo-to-parquet = "mongodb_to_parquet.cli:main"
mongo-to-parquet-legacy = "mongodb_to_parquet.main:main"
